<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101426">
<meta name="description" content="چادرها؛ یک بازی فکری و منطقی فارسی با ۱۰۰ مرحله، راهنمای هوشمند و چالش روزانه.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="چادرها">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>چادرها | بازی فکری کیهانی</title>
<style>
:root{
  --forest:#173d30;--forest-2:#24533f;--mint:#dcebd7;--mint-2:#eef5e9;
  --cream:#f7f6ef;--paper:#fffefa;--ink:#1d3028;--muted:#748279;
  --gold:#e6ad53;--gold-soft:#fff1d4;--line:#e8ebe2;--danger:#c65b4b;
  --shadow:0 18px 50px rgba(24,53,40,.10);--radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 8% 0%,rgba(220,235,215,.7),transparent 30%),radial-gradient(circle at 95% 15%,rgba(255,241,212,.55),transparent 24%),var(--cream)}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid rgba(230,173,83,.75);outline-offset:3px}
.app-shell{max-width:1040px;margin:0 auto;padding:18px 18px 34px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:46px;height:46px;border-radius:16px;background:var(--forest);color:white;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 18px rgba(23,61,48,.2)}
.brand-copy strong{display:block;font-size:19px;letter-spacing:-.4px;color:var(--forest)}
.brand-copy span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.top-pills{display:flex;gap:8px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.78);border:1px solid rgba(232,235,226,.9);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--forest);box-shadow:0 4px 12px rgba(24,53,40,.04)}
.screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:center;background:linear-gradient(125deg,#173d30 0%,#24533f 70%,#2c6249 100%);border-radius:30px;padding:32px;color:#fff;box-shadow:0 22px 55px rgba(23,61,48,.18);min-height:300px}
.hero:before{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.10);border-radius:50%;left:-115px;top:-160px}
.hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:38%;bottom:-190px}
.hero-copy{position:relative;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:7px 11px;border-radius:999px;font-size:11px;color:#e4f1df}
.hero h1{font-size:clamp(28px,5vw,43px);line-height:1.35;margin:16px 0 9px;letter-spacing:-1px}
.hero h1 span{color:#e6c47e}
.hero p{color:rgba(255,255,255,.76);line-height:1.95;font-size:14px;max-width:450px;margin:0 0 20px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border-radius:14px;padding:12px 17px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .16s,box-shadow .16s,background .16s}
.btn:active{transform:scale(.97)}
.btn-primary{background:#e6c47e;color:#263b2d;box-shadow:0 8px 18px rgba(0,0,0,.13)}
.btn-primary:hover{background:#f0d394;transform:translateY(-1px)}
.btn-light{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:white}
.btn-light:hover{background:rgba(255,255,255,.19)}
.btn-green{background:var(--forest);color:#fff;box-shadow:0 8px 18px rgba(23,61,48,.16)}
.btn-green:hover{background:#24533f}
.btn-soft{background:var(--mint-2);color:var(--forest)}
.btn-plain{background:transparent;color:var(--muted);padding:9px 12px}
.btn-danger{background:#fff0ed;color:var(--danger)}
.btn-small{padding:9px 12px;font-size:12px;border-radius:12px}
.hero-art{position:relative;z-index:1;min-height:220px;display:grid;place-items:center}
.art-orbit{width:220px;height:220px;border-radius:50%;border:1px dashed rgba(255,255,255,.3);display:grid;place-items:center;position:relative;animation:floaty 5s ease-in-out infinite}
.art-board{width:156px;height:156px;background:#f7f2df;border-radius:22px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;transform:rotate(-7deg);box-shadow:0 18px 35px rgba(0,0,0,.25)}
.art-cell{border-radius:7px;background:#e6e4d3;display:grid;place-items:center;font-size:23px}
.art-cell.dark{background:#cbdcc5}
.art-spark{position:absolute;font-size:24px}
.art-spark.one{top:13px;right:18px}.art-spark.two{bottom:20px;left:2px;font-size:18px}
.home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:15px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 8px 25px rgba(24,53,40,.045)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-title{font-size:14px;font-weight:900;color:var(--forest)}
.panel-sub{font-size:11px;color:var(--muted);margin-top:3px}
.streak-panel{display:flex;align-items:center;gap:15px;background:linear-gradient(110deg,#fff8e9,#fffefa)}
.streak-flame{width:60px;height:60px;border-radius:19px;background:var(--gold-soft);display:grid;place-items:center;font-size:30px}
.streak-number{font-size:27px;font-weight:950;color:var(--forest);line-height:1}
.streak-days{display:flex;gap:5px;margin-top:12px}
.day-dot{width:18px;height:18px;border-radius:7px;background:#edf0e9;border:1px solid #e4e9df}
.day-dot.active{background:#d6e8ce;border-color:#b9d5ae}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.quick-action{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;color:var(--forest);font-size:11px;font-weight:800;transition:transform .16s,border-color .16s}
.quick-action:hover{transform:translateY(-2px);border-color:#c5d9bd}
.quick-icon{display:block;font-size:21px;margin-bottom:6px}
.progress-track{height:8px;background:#edf0e9;border-radius:999px;overflow:hidden;margin:10px 0 7px}
.progress-fill{height:100%;background:linear-gradient(90deg,#6b9d71,#b3ca78);border-radius:999px;transition:width .35s}
.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.section-title{font-size:19px;color:var(--forest);font-weight:950;margin:4px 0 5px}
.section-desc{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.8}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.page-head h2{margin:0;font-size:22px;color:var(--forest)}
.chapter{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.chapter-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.chapter-name{font-size:14px;font-weight:900;color:var(--forest)}
.chapter-meta{font-size:11px;color:var(--muted);margin-top:3px}
.level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.level-tile{position:relative;min-height:57px;border-radius:14px;border:1px solid #e7ebe2;background:#f9faf6;color:var(--forest);font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,border .15s}
.level-tile:hover:not(:disabled){transform:translateY(-2px);border-color:#b8d2ad}
.level-tile.done{background:#edf5e9;border-color:#d3e4cc}
.level-tile.current{background:var(--forest);color:white;border-color:var(--forest);box-shadow:0 6px 14px rgba(23,61,48,.16)}
.level-tile:disabled{opacity:.43;cursor:not-allowed;background:#f1f1eb}
.tile-stars{font-size:9px;letter-spacing:1px;color:#d69a3b;line-height:1.2}
.tile-lock{font-size:12px;opacity:.65}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.game-title{display:flex;align-items:center;gap:10px}
.icon-button{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--forest);font-size:18px;display:grid;place-items:center}
.game-title h2{font-size:17px;color:var(--forest);margin:0}
.game-title p{font-size:11px;color:var(--muted);margin:3px 0 0}
.difficulty{font-size:10px;padding:6px 9px;border-radius:999px;background:#edf5e9;color:#47734e;font-weight:900}
.game-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.game-stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 11px;display:flex;align-items:center;justify-content:center;gap:7px}
.game-stat .stat-icon{font-size:16px}
.game-stat strong{font-size:12px;color:var(--forest)}
.game-stat span{font-size:10px;color:var(--muted)}
.board-card{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:15px 10px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center}
.board-instruction{font-size:11px;color:var(--muted);margin:0 0 12px;text-align:center}
.board-frame{width:min(100%,570px);direction:ltr}
.top-clues{display:grid;grid-template-columns:34px repeat(var(--n),minmax(0,1fr));gap:5px;margin-bottom:5px}
.board-body{display:grid;grid-template-columns:34px minmax(0,1fr);gap:5px}
.row-clues{display:grid;grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:5px}
.col-clue,.row-clue{border-radius:7px;background:#f0f3eb;color:#66766a;display:flex;align-items:center;justify-content:center;min-height:0;font-size:11px;font-weight:900;transition:background .15s,color .15s}
.col-clue.done,.row-clue.done{background:#e1efdc;color:#386944}
.col-clue.over,.row-clue.over{background:#ffe9e4;color:#b34e40}
.col-clue.focus,.row-clue.focus{outline:2px solid #e6ad53;background:#fff2d9}
.puzzle-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1/1;min-width:0;border-radius:8px;background:#f0f1e9;border:1px solid #e4e8dd;display:grid;place-items:center;padding:0;color:var(--forest);font-size:clamp(15px,4vw,25px);position:relative;transition:transform .12s,background .12s,border-color .12s;user-select:none;-webkit-tap-highlight-color:transparent}
.cell:active{transform:scale(.92)}
.cell.empty:hover{background:#e9f0e4;border-color:#c7d8be}
.cell.tree{background:#dcebd7;border-color:#c5dcc0;cursor:default}
.cell.tent{background:#fff0d4;border-color:#efcf91;box-shadow:inset 0 0 0 1px rgba(230,173,83,.12)}
.cell.grass{background:#e8f0e5;color:#91a78e;font-size:18px}
.cell.conflict{background:#ffe7e2!important;border-color:#d77a6b!important;box-shadow:0 0 0 2px rgba(198,91,75,.12)}
.cell.hint{outline:3px solid #e6ad53;outline-offset:1px;z-index:1;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,173,83,.15)}50%{box-shadow:0 0 0 5px rgba(230,173,83,.18)}}
.cell .mini-mark{position:absolute;bottom:2px;right:3px;font-size:7px;color:#9eaa9d}
.board-legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-icon{font-size:15px}
.game-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}
.control-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 5px;color:var(--forest);font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:58px}
.control-btn .control-icon{font-size:18px}
.control-btn.primary{background:var(--forest);color:white;border-color:var(--forest)}
.control-btn:disabled{opacity:.35;cursor:not-allowed}
.game-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;color:var(--muted);font-size:10px}
.message-strip{margin-top:10px;padding:10px 12px;background:#f1f5ed;border-radius:13px;color:#5b705e;font-size:11px;line-height:1.7;min-height:38px}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,34,26,.48);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px);animation:screenIn .18s ease}
.modal{width:min(100%,430px);background:var(--paper);border-radius:26px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.22);text-align:center;animation:pop .25s ease}
.modal-icon{width:64px;height:64px;border-radius:22px;background:var(--mint-2);display:grid;place-items:center;font-size:30px;margin:0 auto 13px}
.modal h3{font-size:20px;color:var(--forest);margin:0 0 7px}
.modal p{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 17px}
.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.star-row{font-size:27px;letter-spacing:5px;color:#e2a846;margin:9px 0 14px}
.intro-wrap{min-height:calc(100vh - 120px);display:grid;place-items:center}
.intro-card{width:min(100%,600px);background:linear-gradient(145deg,#173d30,#285942);color:white;border-radius:30px;padding:30px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.intro-card:before{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(255,255,255,.12);border-radius:50%;top:-160px;right:-60px}
.intro-logo{width:76px;height:76px;border-radius:25px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:40px;margin:0 auto 14px;animation:floaty 4s ease-in-out infinite}
.intro-card h1{font-size:30px;margin:0 0 8px}
.intro-card>p{color:rgba(255,255,255,.76);font-size:13px;line-height:2;margin:0 auto 20px;max-width:440px}
.intro-step{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:19px;padding:17px;margin:17px auto;max-width:430px}
.intro-step .big{font-size:35px;margin-bottom:8px}
.intro-step h3{font-size:15px;margin:0 0 5px}
.intro-step p{font-size:11px;line-height:1.9;color:rgba(255,255,255,.72);margin:0}
.intro-dots{display:flex;justify-content:center;gap:7px;margin:15px}
.intro-dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.28)}
.intro-dot.active{width:22px;background:#e6c47e}
.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.achievement{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;align-items:center;gap:10px}
.achievement.locked{opacity:.48;filter:grayscale(.7)}
.achievement-icon{width:42px;height:42px;border-radius:14px;background:#fff3d9;display:grid;place-items:center;font-size:21px;flex:none}
.achievement strong{font-size:12px;color:var(--forest);display:block}
.achievement small{font-size:10px;color:var(--muted);display:block;margin-top:3px;line-height:1.5}
.settings-list{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);gap:12px}
.setting-row:last-child{border-bottom:0}
.setting-row strong{font-size:12px;color:var(--forest)}
.setting-row small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.toggle{width:43px;height:25px;border-radius:99px;background:#dfe5dc;padding:3px;transition:background .2s;flex:none}
.toggle:after{content:"";display:block;width:19px;height:19px;background:white;border-radius:50%;transition:transform .2s;box-shadow:0 2px 4px #0002}
.toggle.on{background:#6d9b70}
.toggle.on:after{transform:translateX(-18px)}
.rules-list{display:grid;gap:10px}
.rule{display:flex;align-items:flex-start;gap:11px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:15px}
.rule-icon{font-size:20px;flex:none}
.rule strong{font-size:12px;color:var(--forest);display:block;margin-bottom:3px}
.rule span{font-size:11px;color:var(--muted);line-height:1.8}
.footer-note{text-align:center;color:#9aa59b;font-size:10px;margin-top:22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#183d30;color:#fff;padding:11px 16px;border-radius:13px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:all .22s;z-index:80;max-width:calc(100% - 30px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
 .app-shell{padding:13px 12px 28px}
 .hero{grid-template-columns:1fr;padding:24px 21px;min-height:0}
 .hero-art{min-height:160px;order:-1}
 .art-orbit{width:165px;height:165px}
 .art-board{width:122px;height:122px;padding:8px;gap:4px}
 .art-cell{font-size:18px}
 .hero h1{font-size:30px;margin-top:12px}
 .home-grid{grid-template-columns:1fr}
 .quick-actions{grid-template-columns:repeat(3,1fr)}
 .game-controls{gap:5px}
 .control-btn{font-size:10px;padding:9px 2px}
 .board-card{padding:12px 7px}
 .top-clues{grid-template-columns:28px repeat(var(--n),minmax(0,1fr));gap:3px}
 .board-body{grid-template-columns:28px minmax(0,1fr);gap:3px}
 .puzzle-grid,.row-clues{gap:3px}
 .cell{border-radius:6px}
 .col-clue,.row-clue{font-size:10px;border-radius:5px}
 .game-stats{gap:5px}
 .game-stat{padding:8px 4px;gap:4px}
 .game-stat strong{font-size:11px}
 .game-stat span{font-size:9px}
 .level-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
 .level-tile{min-height:52px}
 .achievement-grid{grid-template-columns:1fr}
}
@media(max-width:390px){
 .brand-copy span{display:none}
 .stat-pill{padding:7px 9px}
 .hero{padding:21px 17px}
 .game-title h2{font-size:15px}
 .difficulty{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* ===== MADAR-inspired cosmic visual system ===== */
:root{
  color-scheme:dark;
  --forest:#ffc857;
  --forest-2:#b8b5ff;
  --mint:#29304d;
  --mint-2:#242943;
  --cream:#101426;
  --paper:rgba(25,29,50,.88);
  --ink:#f5f4fa;
  --muted:#aaa9c3;
  --gold:#ffc857;
  --gold-soft:#44374a;
  --line:rgba(184,181,255,.15);
  --danger:#ff9f68;
  --shadow:0 22px 65px rgba(0,0,0,.34);
  --radius:25px;
}
html,body{background:#101426;color:var(--ink);font-family:Vazirmatn,"Noto Sans Arabic",Tahoma,Arial,sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 12% 4%,rgba(112,91,174,.20),transparent 34%),
    radial-gradient(ellipse at 90% 16%,rgba(74,91,157,.18),transparent 30%),
    radial-gradient(ellipse at 50% 100%,rgba(54,43,91,.25),transparent 44%),
    #101426;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 7% 18%,rgba(255,255,255,.85) 50%,transparent 100%),
    radial-gradient(1px 1px at 23% 73%,rgba(184,181,255,.8) 50%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38% 31%,rgba(255,200,87,.75) 50%,transparent 100%),
    radial-gradient(1px 1px at 54% 83%,rgba(255,255,255,.75) 50%,transparent 100%),

function orth(i,n){const r=Math.floor(i/n),c=i%n,out=[];if(r>0)out.push(i-n);if(r<n-1)out.push(i+n);if(c>0)out.push(i-1);if(c<n-1)out.push(i+1);return out}
function kingNear(a,b,n){return Math.abs(Math.floor(a/n)-Math.floor(b/n))<=1&&Math.abs(a%n-b%n)<=1}
function countSolutions(lv,limit=2){
 const n=lv.n,trees=lv.trees,treeSet=new Set(trees),adj=trees.map(t=>orth(t,n));
 const cellTrees=new Map();adj.forEach((arr,ti)=>arr.forEach(c=>{if(!cellTrees.has(c))cellTrees.set(c,[]);cellTrees.get(c).push(ti)}));
 const opts=adj.map(arr=>arr.filter(c=>!treeSet.has(c)&&(cellTrees.get(c)||[]).length===1));
 if(opts.some(x=>!x.length))return 0;
 const order=opts.map((_,i)=>i).sort((a,b)=>opts[a].length-opts[b].length),row=lv.rows.slice(),col=lv.cols.slice(),chosen=[];let count=0;
 function rec(k){if(count>=limit)return;if(k===order.length){if(row.every(x=>x===0)&&col.every(x=>x===0))count++;return}
  const ti=order[k];for(const cell of opts[ti]){const r=Math.floor(cell/n),c=cell%n;if(row[r]<=0||col[c]<=0||chosen.some(x=>kingNear(x,cell,n)))continue;row[r]--;col[c]--;chosen.push(cell);
   let ok=true;for(let rr=0;rr<n&&ok;rr++){let possible=0;for(let z=k+1;z<order.length;z++)if(opts[order[z]].some(x=>Math.floor(x/n)===rr)){possible++}if(row[rr]>possible)ok=false}
   for(let cc=0;cc<n&&ok;cc++){let possible=0;for(let z=k+1;z<order.length;z++)if(opts[order[z]].some(x=>x%n===cc)){possible++}if(col[cc]>possible)ok=false}
   if(ok)rec(k+1);chosen.pop();row[r]++;col[c]++;if(count>=limit)return;
  }
 }
 rec(0);return count;
}
function validateLevel(lv){
 const n=lv.n,trees=new Set(lv.trees),tents=new Set(lv.solution);
 if(trees.size!==lv.trees.length||tents.size!==lv.solution.length||trees.size!==tents.size)return false;
 if(lv.rows.length!==n||lv.cols.length!==n||lv.rows.reduce((a,b)=>a+b,0)!==tents.size||lv.cols.reduce((a,b)=>a+b,0)!==tents.size)return false;
 const rr=Array(n).fill(0),cc=Array(n).fill(0);
 for(const t of trees){if(t<0||t>=n*n||tents.has(t))return false;const near=orth(t,n).filter(x=>tents.has(x));if(near.length!==1)return false}
 for(const t of tents){if(t<0||t>=n*n||trees.has(t))return false;const near=orth(t,n).filter(x=>trees.has(x));if(near.length!==1)return false;const r=Math.floor(t/n),c=t%n;rr[r]++;cc[c]++;for(const other of tents)if(other!==t&&kingNear(t,other,n))return false}
 if(rr.some((x,i)=>x!==lv.rows[i])||cc.some((x,i)=>x!==lv.cols[i]))return false;
 return countSolutions(lv,2)===1;
}

 stopTimer();currentLevel=id;
 const saved=profile.boards[id];
 const isDone=profile.completed.includes(id);
 board=(!forceReset&&!isDone&&Array.isArray(saved)&&saved.length===lv.n*lv.n)?saved.slice():Array(lv.n*lv.n).fill(0);
 mistakes=forceReset||isDone?0:Number(profile.mistakes[id]||0);
 hintsUsed=forceReset||isDone?0:Number(profile.hints[id]||0);
 if(forceReset||isDone){profile.boards[id]=board.slice();profile.mistakes[id]=0;profile.hints[id]=0;profile.times[id]=0}
 history=[];redoStack=[];highlight.clear();conflicts.clear();
 elapsedMs=forceReset||isDone?0:Number(profile.times[id]||0);startedAt=Date.now();paused=false;screen="game";save();render();
}

function bindActions(){

  case "home":stopTimer();setScreen("home");break;

 const lv=levelData(currentLevel);if(lv.trees.includes(i))return;

function checkPuzzle(){
 const lv=levelData(currentLevel),n=lv.n,trees=new Set(lv.trees),tents=[];board.forEach((v,i)=>{if(v===1)tents.push(i)});
 const row=Array(n).fill(0),col=Array(n).fill(0),bad=new Set(),issues=[];
 tents.forEach(t=>{row[Math.floor(t/n)]++;col[t%n]++;const near=orth(t,n).filter(x=>trees.has(x));if(near.length!==1){bad.add(t);issues.push("هر چادر باید کنار دقیقاً یک درخت باشد.")}for(const other of tents)if(other!==t&&kingNear(t,other,n)){bad.add(t);bad.add(other);issues.push("چادرها نباید از ضلع یا گوشه به هم بچسبند.")}});
 for(const t of trees){const near=orth(t,n).filter(x=>board[x]===1);if(near.length!==1){bad.add(t);near.forEach(x=>bad.add(x));issues.push("هر درخت باید دقیقاً یک چادر داشته باشد.")}}
 for(let r=0;r<n;r++)if(row[r]!==lv.rows[r]){for(let c=0;c<n;c++)if(board[r*n+c]===1)bad.add(r*n+c);issues.push(`تعداد چادرهای سطر ${fa(r+1)} درست نیست.`)}
 for(let c=0;c<n;c++)if(col[c]!==lv.cols[c]){for(let r=0;r<n;r++)if(board[r*n+c]===1)bad.add(r*n+c);issues.push(`تعداد چادرهای ستون ${fa(c+1)} درست نیست.`)}
 if(tents.length!==trees.size)issues.push("تعداد چادرها باید با تعداد درخت‌ها برابر باشد.");
 if(!issues.length){completeLevel();return}
 mistakes++;profile.totalMistakes++;profile.mistakes[currentLevel]=mistakes;conflicts=bad;save();tone("bad");vibrate(45);renderGame();bindActions();const msg=[...new Set(issues)][0];$("#gameMessage").textContent="هنوز کامل نشده؛ "+msg;toast("هنوز چند نکته باقی مانده. با دقت بررسی کن.");
}
function showHintMenu(){
 if(hintsUsed>=3){toast("راهنماهای این مرحله تمام شده‌اند.");return}
 openModal("💡","چه کمکی لازم داری؟","راهنمایی‌ها به‌ترتیب از ملایم تا مستقیم هستند. در هر مرحله حداکثر سه راهنما داری.",`<button class="btn btn-soft" data-modal="hint-gentle">🌱 راهنمای ملایم</button><button class="btn btn-soft" data-modal="hint-guided">🎯 راهنمای هدفمند</button><button class="btn btn-green" data-modal="hint-direct">⛺ نشان دادن یک چادر</button><button class="btn btn-plain" data-modal="close">فعلاً نه</button>`);
}
modalRoot.addEventListener("click",e=>{const b=e.target.closest("[data-modal]");if(!b)return;const a=b.dataset.modal;if(a==="hint-gentle"){closeModal();applyHint("gentle")}else if(a==="hint-guided"){closeModal();applyHint("guided")}else if(a==="reset-level-confirm"){closeModal();resetLevel()}});
function applyHint(kind){
 if(hintsUsed>=3)return;const lv=levelData(currentLevel),n=lv.n;hintsUsed++;profile.totalHints++;profile.hints[currentLevel]=hintsUsed;
 highlight.clear();
 let msg="",icon="💡";
 if(kind==="gentle"){
  const tree=lv.trees.find(t=>orth(t,n).filter(x=>board[x]===1).length!==1)||lv.trees[0];
  highlight.add(tree);orth(tree,n).forEach(x=>{if(!lv.trees.includes(x))highlight.add(x)});
  msg="به خانه‌های اطراف درخت مشخص‌شده نگاه کن. چادر فقط می‌تواند بالا، پایین، چپ یا راست درخت قرار بگیرد؛ نه در گوشه.";
 }else if(kind==="guided"){
  let targetRow=-1;for(let r=0;r<n;r++){const missing=lv.solution.filter(x=>Math.floor(x/n)===r&&board[x]!==1);if(missing.length){targetRow=r;break}}
  if(targetRow>=0){for(let c=0;c<n;c++)highlight.add(targetRow*n+c);msg=`در سطر ${fa(targetRow+1)} هنوز ${fa(lv.rows[targetRow]-board.slice(targetRow*n,(targetRow+1)*n).filter(x=>x===1).length)} چادر لازم است. خانه‌های مجاور درخت‌ها را با دقت بررسی کن.`}
  else{const targetCol=lv.solution.find(x=>board[x]!==1)%n;for(let r=0;r<n;r++)highlight.add(r*n+targetCol);msg=`به ستون ${fa(targetCol+1)} توجه کن؛ عدد بالای ستون تعداد دقیق چادرها را نشان می‌دهد.`}
 }else{hintsUsed--;profile.totalHints--;profile.hints[currentLevel]=hintsUsed;applyDirectHint();return}
 save();renderGame();bindActions();openModal(icon,"یک سرنخ برای تو",msg,'<button class="btn btn-green" data-modal="hint-close">متوجه شدم</button>');
}
function applyDirectHint(){
 if(hintsUsed>=3)return;const lv=levelData(currentLevel);const cell=lv.solution.find(x=>board[x]!==1);
 if(cell===undefined){toast("تقریباً همه چادرها را درست چیده‌ای؛ بررسی را بزن.");return}
 history.push(board.slice());redoStack=[];board[cell]=1;hintsUsed++;profile.totalHints++;profile.hints[currentLevel]=hintsUsed;highlight=new Set([cell]);conflicts.clear();save();renderGame();bindActions();openModal("⛺","یک چادر درست پیدا شد",`خانه مشخص‌شده یکی از جایگاه‌های درست چادر است. حالا بقیه جدول را با منطق خودت کامل کن.`,'<button class="btn btn-green" data-modal="hint-close">ادامه می‌دهم</button>');tone("good");vibrate(18);
}
function completeLevel(){
 stopTimer();const id=currentLevel,elapsed=elapsedNow(),score=hintsUsed===0&&mistakes===0?3:(hintsUsed<=1&&mistakes<=1?2:1),wasDone=profile.completed.includes(id);
 if(!wasDone){profile.completed.push(id);profile.completed.sort((a,b)=>a-b)}
 profile.stars[id]=Math.max(profile.stars[id]||0,score);
 profile.bestTimes[id]=profile.bestTimes[id]?Math.min(profile.bestTimes[id],elapsed):elapsed;
 profile.unlocked=Math.max(profile.unlocked,Math.min(LEVELS.length,id+1));
 if(score===3&&!wasDone)profile.perfect++;
 const t=today();if(profile.lastCompletedDay!==t){profile.currentStreak=profile.lastCompletedDay===yesterday()?profile.currentStreak+1:1;profile.bestStreak=Math.max(profile.bestStreak,profile.currentStreak);profile.lastCompletedDay=t;profile.activityDays=[...new Set([...(profile.activityDays||[]),t])].slice(-120)}
 if(hintsUsed===0&&!profile.noHintLevels.includes(id))profile.noHintLevels.push(id);profile.boards[id]=Array(levelData(id).n**2).fill(0);profile.times[id]=0;profile.mistakes[id]=0;profile.hints[id]=0;save();tone("win");vibrate([25,35,25]);
 const streak=currentStreak(),milestone=[3,7,14,30,100].includes(streak);
 const next=id<LEVELS.length;
 const title=id===100?"تو افسانه چادرهایی!":"آفرین! مرحله کامل شد";
 const body=`مرحله ${fa(id)} را در ${fmtTime(elapsed)} حل کردی. ${wasDone?"این بار هم یک پیروزی دیگر ثبت شد.":"مرحله بعدی برایت باز شد."}${milestone?` استریک ${fa(streak)} روزه‌ات هم ثبت شد!`:""}`;
 const starsHtml=`<div class="star-row">${"★".repeat(score)}<span style="color:#e9e8df">${"★".repeat(3-score)}</span></div>`;
 openModal("🏆",title,body+starsHtml,`${next?'<button class="btn btn-green" data-modal="next">مرحله بعدی ←</button>':'<button class="btn btn-green" data-modal="home">بازگشت به خانه</button>'}<button class="btn btn-soft" data-modal="replay">تکرار مرحله</button>`);
 updateTop();
}
function resetProgress(){profile=defaults();board=[];history=[];redoStack=[];currentLevel=1;elapsedMs=0;startedAt=0;try{localStorage.setItem(KEY,JSON.stringify(profile))}catch(e){}closeModal();introStep=0;setScreen("intro")}
function renderAchievements(){
 const items=[
  ["🌱","اولین قدم","اولین مرحله را کامل کن",completedCount()>=1],
  ["🧠","ذهن کنجکاو","۱۰ مرحله را کامل کن",completedCount()>=10],
  ["🏅","نیمه راه","۵۰ مرحله را کامل کن",completedCount()>=50],
  ["👑","افسانه چادرها","هر ۱۰۰ مرحله را کامل کن",completedCount()>=100],
  ["🔥","هفته طلایی","۷ روز متوالی بازی کن",profile.bestStreak>=7],
  ["💎","بی‌نقص","یک مرحله را با سه ستاره تمام کن",Object.values(profile.stars).some(x=>x===3)],
  ["🕊️","بدون راهنما","یک مرحله را بدون راهنمایی حل کن",(profile.noHintLevels||[]).length>0],
  ["🌳","جنگل‌بان","۳۰ مرحله را کامل کن",completedCount()>=30]
 ];
 screenEl.innerHTML=`<div class="page-head"><div><h2>دستاوردها</h2><p class="section-desc" style="margin:4px 0 0">هر قدم کوچک، یک افتخار تازه است.</p></div><button class="icon-button" data-action="home">⌂</button></div><div class="panel" style="margin-bottom:14px"><div class="panel-head"><div><div class="panel-title">مجموع ستاره‌ها</div><div class="panel-sub">از ${fa(completedCount())} مرحله تکمیل‌شده</div></div><strong style="font-size:24px;color:var(--forest)">⭐ ${fa(totalStars())}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${completedCount()}%"></div></div></div><div class="achievement-grid">${items.map(x=>`<div class="achievement ${x[3]?"":"locked"}"><div class="achievement-icon">${x[0]}</div><div><strong>${x[1]}</strong><small>${x[2]}${x[3]?" · دریافت شد":""}</small></div></div>`).join("")}</div>`;
}

function exportLevels(){
 const payload={format:"chadorha-levels-v1",levels:LEVELS};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="chadorha-levels.json";a.click();URL.revokeObjectURL(url);toast("فایل مرحله‌های افزوده آماده شد.");
}
function importLevels(file){
 const reader=new FileReader();reader.onload=()=>{try{
  const parsed=JSON.parse(String(reader.result||""));const incoming=Array.isArray(parsed)?parsed:parsed.levels;
  if(!Array.isArray(incoming)||!incoming.length)throw Error("فرمت فایل معتبر نیست.");
  const accepted=[],signature=x=>`${x.n}|${x.trees.slice().sort((a,b)=>a-b).join(",")}|${x.rows.join(",")}|${x.cols.join(",")}`,seen=new Set(LEVELS.map(signature));
  for(const lv of incoming){if(!lv||!Number.isInteger(lv.n)||lv.n<4||lv.n>15||!Array.isArray(lv.trees)||!Array.isArray(lv.rows)||!Array.isArray(lv.cols)||!Array.isArray(lv.solution))continue;if([...lv.trees,...lv.rows,...lv.cols,...lv.solution].some(x=>!Number.isInteger(x)))continue;const sig=signature(lv);if(seen.has(sig))continue;if(validateLevel(lv)){accepted.push({n:lv.n,trees:lv.trees,rows:lv.rows,cols:lv.cols,solution:lv.solution});seen.add(sig)}}
  if(!accepted.length)throw Error("هیچ مرحله معتبر و دارای جواب یکتا پیدا نشد.");
  LEVELS=LEVELS.concat(accepted);profile.customLevels=[...(profile.customLevels||[]),...accepted];if(profile.completed.includes(100))profile.unlocked=Math.max(profile.unlocked,101);save();renderSettings();toast(`${fa(accepted.length)} مرحله جدید اضافه شد.`);
 }catch(err){toast(err.message||"فایل قابل خواندن نیست.")}};reader.readAsText(file);
}
function renderSettings(){
 screenEl.innerHTML=`<div class="page-head"><div><h2>تنظیمات</h2><p class="section-desc" style="margin:4px 0 0">بازی را مطابق سلیقه‌ات تنظیم کن.</p></div><button class="icon-button" data-action="home">⌂</button></div><div class="settings-list"><div class="setting-row"><div><strong>افکت‌های صوتی</strong><small>صدای لمس، راهنمایی و پیروزی</small></div><button class="toggle ${profile.sound?"on":""}" data-action="sound-toggle" aria-label="تغییر صدا"></button></div><div class="setting-row"><div><strong>لرزش هنگام تعامل</strong><small>در دستگاه‌های پشتیبانی‌شده</small></div><button class="toggle ${profile.vibration?"on":""}" data-action="vibe-toggle" aria-label="تغییر لرزش"></button></div><div class="setting-row"><div><strong>آموزش آغاز بازی</strong><small>قوانین را دوباره مرور کن</small></div><button class="btn btn-soft btn-small" data-action="replay-tutorial">نمایش آموزش</button></div><div class="setting-row"><div><strong>افزودن مرحله‌های جدید</strong><small>ورود یا خروجی گرفتن از مرحله‌ها با فایل JSON</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-soft btn-small" data-action="export-levels">خروجی JSON</button><button class="btn btn-green btn-small" data-action="import-levels">افزودن</button><input id="levelFile" type="file" accept=".json,application/json" style="display:none"></div></div><div class="setting-row"><div><strong>پاک کردن تمام پیشرفت</strong><small>حذف مرحله‌ها، ستاره‌ها و رکوردها</small></div><button class="btn btn-danger btn-small" data-action="reset-profile">پاک کردن</button></div></div><div class="panel" style="margin-top:14px"><div class="panel-title">درباره چادرها</div><p class="section-desc" style="margin:6px 0 0">یک بازی منطقی مستقل با ۱۰۰ مرحله اولیه. پیشرفت در همین مرورگر ذخیره می‌شود. برای افزودن مرحله، فایل JSON با فیلدهای n، trees، rows، cols و solution وارد کن؛ خانه‌ها با شماره‌گذاری صفرمبنا مشخص می‌شوند. هر مرحله پیش از اضافه‌شدن از نظر قوانین و یکتایی جواب بررسی می‌شود.</p></div>`;
}
function renderRules(){
 const rules=[["🌳","هر درخت، یک چادر","برای هر درخت باید دقیقاً یک چادر در یکی از خانه‌های بالا، پایین، چپ یا راست آن قرار بگیرد."],["⛺","چادرها کنار هم نمی‌آیند","چادرها نباید از ضلع یا حتی گوشه به یکدیگر بچسبند."],["🔗","هر چادر فقط یک درخت","هر چادر باید کنار دقیقاً یک درخت باشد؛ نه صفر و نه دو درخت."],["🔢","اعداد سطر و ستون","اعداد اطراف جدول تعداد دقیق چادرهای هر سطر و ستون را مشخص می‌کنند."],["👆","روش بازی","با هر لمس، خانه بین چادر، چمن و خالی جابه‌جا می‌شود. درخت‌ها ثابت هستند."]];
 screenEl.innerHTML=`<div class="page-head"><div><h2>قوانین بازی</h2><p class="section-desc" style="margin:4px 0 0">این پنج قانون را به خاطر بسپار.</p></div><button class="icon-button" data-action="home">⌂</button></div><div class="rules-list">${rules.map(r=>`<div class="rule"><div class="rule-icon">${r[0]}</div><div><strong>${r[1]}</strong><span>${r[2]}</span></div></div>`).join("")}</div><div style="text-align:center;margin-top:18px"><button class="btn btn-green" data-action="continue">شروع بازی ←</button></div>`;
}
let lastAutoSave=Date.now();setInterval(()=>{if(screen==="game"&&!paused){const el=$("#timer");if(el)el.textContent=fmtTime(elapsedNow());if(Date.now()-lastAutoSave>10000){save();lastAutoSave=Date.now()}}},1000);
render();
})();
</script>

<script>
(()=>{
  let installPrompt=null;
  const installButton=document.getElementById("installApp");
  const isStandalone=window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
  if(isStandalone && installButton){installButton.style.display="none";}
  window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;});
  if(installButton){
    installButton.addEventListener("click",async()=>{
      if(isStandalone){return;}
      if(installPrompt){
        installPrompt.prompt();
        try{await installPrompt.userChoice;}catch(e){}
        installPrompt=null;
      }else{
        const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
        const message=ios?"برای نصب، دکمه اشتراک‌گذاری مرورگر را بزن و گزینه Add to Home Screen را انتخاب کن.":"برای نصب، از منوی مرورگر گزینه Install app یا Add to Home Screen را انتخاب کن.";
        const toast=document.getElementById("toast");
        if(toast){toast.textContent=message;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),4200);}
      }
    });
  }
  window.addEventListener("appinstalled",()=>{if(installButton)installButton.style.display="none";installPrompt=null;});
  if("serviceWorker" in navigator && location.protocol!=="file:"){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
  }
})();
</script>
